name: Global Macro & Geopolitical News Radar

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    # Runs every 15 minutes between 02:30 UTC and 16:30 UTC on weekdays
    # (Matches 8:00 AM to 10:00 PM IST, Monday to Friday)
    - cron: '*/15 2-16 * * 1-5'

concurrency:
  group: global-macro
  cancel-in-progress: false

jobs:
  run-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance feedparser pytz

      - name: Run Global Macro Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 global_macro_news.py --once

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add global_macro_state.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Auto-update global_macro_state.json [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi